; isolation-sphere solo — PlatformIO 設定
;
;   pio run -e atoms3r                  ビルド (既定)
;   pio run -e atoms3r -t upload        USB 書き込み (パーティション表の更新は USB のみ)
;   pio run -e atoms3r -t uploadfs      LittleFS (data/) 書き込み
;   pio run -e atoms3r_ota -t upload    OTA 書き込み (SoftAP 接続後: 192.168.4.1)
;   pio test -e native                  JPEG 境界パーサーの単体テスト (PC上)

[platformio]
default_envs = atoms3r

; ---------------------------------------------------------------------------
; M5AtomS3R (本体: 5ストリップ + 内蔵LCD + ブザー) / 外部 BNO055
; ---------------------------------------------------------------------------
[env:atoms3r]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_type = debug
build_flags =
	-D BOARD_M5ATOMS3R
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	; FastLED 3.10 の実行時ログ (FL_WARN) を止める。既定は NDEBUG 未定義で有効になり、
	; Arduino の Serial とは別経路で USB-Serial-JTAG に書く。フラッシュ約 15KB 削減。
	; 注: LED 出力 55ms (docs/solo_mode.md §9) の原因ではなかった (無効化しても実測変化なし)。
	-D FASTLED_LOG_VERBOSITY=0
	; FastLED (3.7.8, IDF4 RMT) の割り込みはフラッシュ上の IDF 関数を呼ぶため、他コアが
	; フラッシュを読んでキャッシュを止めた瞬間に "Cache disabled but cached memory region
	; accessed" でパニックする。solo は LittleFS を 10fps で読み続けるので必ず踏む (実機で再現)。
	; show() の間だけ spi_flash_op_lock() でフラッシュ操作を止める。LittleFS 読み出しが
	; 最大で LED 出力 1 回分 (数 ms) 待つだけで、100ms 締切には影響しない。
	-D FASTLED_ESP32_FLASH_LOCK=1
	; FastLED RMT4 (IDF 4.4) の並列度を最大化する。既定 FASTLED_RMT_MEM_BLOCKS=2 は
	; 1 チャンネルに RMT メモリブロックを 2 個割り当てるため、使える TX チャンネルが
	; 4→2 に半減し (idf4_rmt_impl.cpp の `i += gMemBlocks` ループ)、5 ストリップが
	; 3 バッチに直列化していた (実測 out=15.2ms ≈ 3 × 160LED × 30us)。
	; 1 にすると 4 チャンネル並列 = 2 バッチ (4+1) となり派生元では ~9.6ms に短縮。
	; 副作用: リフィル割り込みの頻度が上がるため、Wi-Fi 割り込み負荷が高い状況で
	; 稀にちらつく可能性がある。出るようなら 2 に戻す。
	-D FASTLED_RMT_MEM_BLOCKS=1
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	; Core libraries
	Wire
	WiFi
	DNSServer          ; キャプティブポータル (全ホスト名を AP 自身へ解決)

	; JSON configuration
	bblanchon/ArduinoJson@^6.21.3

	; Image processing (Baseline JPEG -> RGB565)
	bodmer/TJpg_Decoder@^1.0.8

	; LED control
	; 3.10.x は ESP32 の RMT ドライバが ChannelManager 実装に置き換わり、S3 の 5 ストリップ
	; (TX チャンネル 4 本) で挙動が変わる。球体に組み込んで LiPo 起動すると earlyBlank() の
	; 直後に全 LED が白点灯し電源が落ちた (実機 2026-09-22)。元プロジェクトが宣言していた
	; 3.7.8 (動作実績のある版) に固定する。
	fastled/FastLED@3.7.8

	; LCD display
	m5stack/M5Unified@^0.2.3

	; IMU sensor
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1
lib_ldf_mode = deep
upload_port = /dev/ttyACM0

; !! 未検証 (2026-09-23): IMU モジュールを派生元 feat/ui-v2 から移植した際、M5IMU バックエンド
;    (IMUManager_m5imu.cpp) は startTask/takeDiag* を実装しておらずリンクしない可能性が高い。
;    派生元でも QUARANTINED。sphere001 は BNO055 (atoms3r)。
; M5AtomS3R + 内蔵IMU(BMI270)。外部 BNO055 を使わず、M5内蔵6軸IMU を
; ソフト Madgwick 融合で姿勢推定する (IMUManager のバックエンド切替)。
; M5IMU が BNO055 より優先されるため、継承した -D IMU_SENSOR_BNO055 はそのままで問題ない。
[env:atoms3r_m5imu]
extends = env:atoms3r
build_flags =
	${env:atoms3r.build_flags}
	-D IMU_SENSOR_M5IMU

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32S3 (4ストリップ / LCD・ブザーなし)
; LCD が無いため接続用 QR は表示できない (SSID/パスワードは config.json 参照)
; ---------------------------------------------------------------------------
[env:xiao_esp32s3]
extends = env:atoms3r
board = seeed_xiao_esp32s3
upload_port =
build_flags =
	-D BOARD_XIAO_ESP32S3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-D FASTLED_LOG_VERBOSITY=0   ; atoms3r と同じ理由 (FastLED 実行時ログの無効化)
	-D FASTLED_ESP32_FLASH_LOCK=1 ; atoms3r と同じ理由 (RMT 割り込みとフラッシュ読み出しの競合回避)
	-D FASTLED_RMT_MEM_BLOCKS=1   ; atoms3r と同じ理由 (RMT TX チャンネルを 4 本使う)
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	Wire
	WiFi
	DNSServer
	bblanchon/ArduinoJson@^6.21.3
	bodmer/TJpg_Decoder@^1.0.8
	fastled/FastLED@3.7.8   ; atoms3r と同じ理由で固定
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1

; ---------------------------------------------------------------------------
; OTA (espota) 書き込み。ビルド設定は通常 env を継承し、経路だけ差し替える。
; solo は SoftAP なので宛先は AP 自身の IP (config.json の solo.ap.ip)。
; 書き込む PC を先に AP へ接続させること。
; NOTE: パーティション表の変更は OTA では反映されないため、初回は USB で書き込む。
; ---------------------------------------------------------------------------
[env:atoms3r_ota]
extends = env:atoms3r
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

[env:atoms3r_m5imu_ota]
extends = env:atoms3r_m5imu
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

; LAN (STA) 経由の OTA。Web UI の「LAN 接続」で SSID/パスワードを保存して再起動すると、
; 球体は AP を維持したまま普段の Wi-Fi にも繋がる。PC の Wi-Fi を切り替えずに書き込める。
; 宛先は mDNS 名 (ArduinoOTA が isolation-sphere.local を広告する)。解決できない場合は
; upload_port に STA の IP (Web UI の「LAN (STA)」欄に出る) を指定する。
[env:atoms3r_lan_ota]
extends = env:atoms3r
upload_protocol = espota
upload_port = isolation-sphere.local
upload_flags =
	--auth=isolation-sphere-ota

[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

; ---------------------------------------------------------------------------
; PC 上の単体テスト: src/JpegScan.h (ヘッダオンリー・Arduino非依存) の境界条件。
; src/ 全体はビルドしない (ESP32 専用コードが含まれるため)。
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; test/mocks/Arduino.h は imu/*.h が使う millis() 等の最小スタブ (派生元 feat/ui-v2 から移植)
build_flags = -I src -I test/mocks -std=c++14 -D NATIVE_ENV
test_build_src = false
