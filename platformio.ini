; isolation-sphere solo — PlatformIO 設定
;
;   pio run -e atoms3r                  ビルド (既定)
;   pio run -e atoms3r -t upload        USB 書き込み (パーティション表の更新は USB のみ)
;   pio run -e atoms3r -t uploadfs      LittleFS (data/) 書き込み
;   pio run -e atoms3r_ota -t upload    OTA 書き込み (SoftAP 接続後: 192.168.4.1)
;   pio test -e native                  JPEG 境界パーサーの単体テスト (PC上)

[platformio]
default_envs = atoms3r

; ---------------------------------------------------------------------------
; M5AtomS3R (本体: 5ストリップ + 内蔵LCD + ブザー) / 外部 BNO055
; ---------------------------------------------------------------------------
[env:atoms3r]
platform = espressif32@^6.8.1
platform_packages =
	platformio/framework-arduinoespressif32@^3.20017.0
	platformio/tool-esptoolpy@1.40501.0
framework = arduino
board = m5stack-atoms3
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
build_type = debug
build_flags =
	-D BOARD_M5ATOMS3R
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	; Core libraries
	Wire
	WiFi
	DNSServer          ; キャプティブポータル (全ホスト名を AP 自身へ解決)

	; JSON configuration
	bblanchon/ArduinoJson@^6.21.3

	; Image processing (Baseline JPEG -> RGB565)
	bodmer/TJpg_Decoder@^1.0.8

	; LED control
	fastled/FastLED@^3.7.8

	; LCD display
	m5stack/M5Unified@^0.2.3

	; IMU sensor
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1
lib_ldf_mode = deep
upload_port = /dev/ttyACM0

; M5AtomS3R + 内蔵IMU(BMI270)。外部 BNO055 を使わず、M5内蔵6軸IMU を
; ソフト Madgwick 融合で姿勢推定する (IMUManager のバックエンド切替)。
; M5IMU が BNO055 より優先されるため、継承した -D IMU_SENSOR_BNO055 はそのままで問題ない。
[env:atoms3r_m5imu]
extends = env:atoms3r
build_flags =
	${env:atoms3r.build_flags}
	-D IMU_SENSOR_M5IMU

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32S3 (4ストリップ / LCD・ブザーなし)
; LCD が無いため接続用 QR は表示できない (SSID/パスワードは config.json 参照)
; ---------------------------------------------------------------------------
[env:xiao_esp32s3]
extends = env:atoms3r
board = seeed_xiao_esp32s3
upload_port =
build_flags =
	-D BOARD_XIAO_ESP32S3
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ESP32S3
	-D BOARD_HAS_PSRAM
	-D CORE_DEBUG_LEVEL=4
	-D DEBUG
	-D IMU_SENSOR_BNO055
	-fpermissive
	-std=c++14
	-I src/boards
lib_deps =
	Wire
	WiFi
	DNSServer
	bblanchon/ArduinoJson@^6.21.3
	bodmer/TJpg_Decoder@^1.0.8
	fastled/FastLED@^3.7.8
	adafruit/Adafruit BNO055@^1.6.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	adafruit/Adafruit BusIO@^1.16.1

; ---------------------------------------------------------------------------
; OTA (espota) 書き込み。ビルド設定は通常 env を継承し、経路だけ差し替える。
; solo は SoftAP なので宛先は AP 自身の IP (config.json の solo.ap.ip)。
; 書き込む PC を先に AP へ接続させること。
; NOTE: パーティション表の変更は OTA では反映されないため、初回は USB で書き込む。
; ---------------------------------------------------------------------------
[env:atoms3r_ota]
extends = env:atoms3r
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

[env:atoms3r_m5imu_ota]
extends = env:atoms3r_m5imu
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

[env:xiao_esp32s3_ota]
extends = env:xiao_esp32s3
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
	--auth=isolation-sphere-ota

; ---------------------------------------------------------------------------
; PC 上の単体テスト: src/JpegScan.h (ヘッダオンリー・Arduino非依存) の境界条件。
; src/ 全体はビルドしない (ESP32 専用コードが含まれるため)。
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -I src -std=c++11 -D NATIVE_ENV
test_build_src = false
